          ${blockedCount ? html`<span class="flag-pill tone-bad">${I.lock}${plural(blockedCount, 'submission')} blocked</span>` : nothing}
          ${reviewCount ? html`<span class="flag-pill tone-mid">${I.clock}${plural(reviewCount, 'document')} to review</span>` : nothing}
          ${!blockedCount && !reviewCount ? html`<span class="flag-pill tone-ok">${I.check} Nothing blocked</span>` : nothing}
        </div>
      </div>
      <div class="row">
        <span style="font-size:13px;font-weight:600;color:var(--fg-2);margin-right:4px">Who can upload</span>
        ${(p.partners || []).map((pt) => html`<span class="chip"><strong>${pt.name}</strong><span class="muted">${pt.role}</span></span>`)}
        <button class="btn sm dashed pillbtn" @click=${() => { ui.invite = { pid: p.id, name: '', role: '', label: '', contact: '', email: '' }; rerender(); }}>+ Invite partner</button>
      </div>
      <div class="lifecycle">${phases.map((x) => html`<button class=${'phase' + (x.cur ? ' cur' : '')} @click=${() => { coll[x.ph] = false; const f = p.packets.find((k) => k.phase === x.ph); if (f) ui.sel[p.id] = f.id; rerender(); }}>
        <div class="row" style="justify-content:space-between;width:100%"><span class="eyebrow" style="font-size:11px">Phase ${x.i + 1}</span><span style=${'display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:' + (x.cur ? 'var(--accent)' : x.color)}>${x.state === 'Complete' ? I.check : nothing}${x.cur ? 'Current' : x.state}</span></div>
        <div style="font-size:15px;font-weight:600">${x.ph}</div><div class="small muted">${x.note}</div>
      </button>`)}</div>
      <details class="facts">
        <summary>${I.caret} Project settings and plan set facts the AI checks against</summary>
        <div class="col" style="gap:12px;padding-top:8px">
          <div class="grid3">
            <label class="field">Current phase<select .value=${p.stage || 'Pre-planning'} @change=${(e) => mutate(p.id, (pp) => { pp.stage = e.target.value; logTo(pp, 'Project moved to ' + e.target.value + '.', 'info'); })}>${PHASES.map((ph) => html`<option value=${ph} ?selected=${(p.stage || 'Pre-planning') === ph}>${ph}</option>`)}</select></label>
          </div>
          <label class="field">Plan set facts<textarea id=${'facts-' + p.id} class="inp" rows="7" .value=${ui.factsDraft && ui.factsDraft.pid === p.id ? ui.factsDraft.text : (p.facts || '')} @input=${(e) => { ui.factsDraft = { pid: p.id, text: e.target.value }; }} placeholder="Key facts from the stamped plan set: equipment, breaker ratings, sheet numbers, suppression system…"></textarea></label>
          <div class="row"><button class="btn sm primary" @click=${() => { const t = ui.factsDraft && ui.factsDraft.pid === p.id ? ui.factsDraft.text : p.facts; ui.factsDraft = null; mutate(p.id, (pp) => { pp.facts = t; }); toast('Plan set facts saved.'); }}>Save facts</button><span class="small muted">Every AI pre-review on this project compares documents against these facts.</span></div>
        </div>
      </details>
    </section>

    <div class="split">
      <div class="packets">
        <div class="row" style="justify-content:space-between"><h2 style="font-size:19px">Document packets</h2>
          <button class="btn sm outline" @click=${() => { ui.newPacket = { pid: p.id, name: '', to: '', phase: p.stage || 'Permitting', tpl: 'Blank', copyFrom: '' }; rerender(); }}>+ Custom packet</button></div>
        ${PHASES.map((ph) => {
          const items = p.packets.filter((x) => x.phase === ph); if (!items.length) return nothing;
          const open = !coll[ph]; const allDone = items.every((x) => finished(infos.get(x.id).gate));
          const b = items.filter((x) => infos.get(x.id).gate === 'blocked').length;
          return html`<button class=${'group' + (open ? ' open' : '')} aria-expanded=${open ? 'true' : 'false'} @click=${() => { coll[ph] = open; rerender(); }}>
            ${I.caret}<span class="eyebrow" style="color:var(--fg-2)">${ph}</span>${allDone ? html`<span style="color:var(--ok-dot)">${I.check}</span>` : nothing}
            <span class="small muted" style="margin-left:auto">${plural(items.length, 'packet')}${allDone ? ' · Complete' : b ? ' · ' + b + ' blocked' : ''}</span></button>
          ${open ? html`<div class="col" style="gap:8px;padding:4px 0 6px">${items.map((x) => { const i = infos.get(x.id); return html`
            <button class=${'pk' + (x.id === selId ? ' on' : '')} @click=${() => { ui.sel[p.id] = x.id; ui.addDoc = null; rerender(); }}>
              <div class="row" style="justify-content:space-between;align-items:flex-start;width:100%;flex-wrap:nowrap">
                <div class="col" style="gap:2px;min-width:0"><span style="font-size:15px;font-weight:600">${x.name}</span><span class="small muted">To: ${x.to}</span></div>
                <span class=${'pill tone-' + i.tone} style="flex:none">${i.status}</span></div>
              <div class="row" style="width:100%;flex-wrap:nowrap"><div class="bar"><span style=${'width:' + (i.total ? Math.round(i.done / i.total * 100) : 0) + '%;background:' + ({ ok: 'var(--ok-dot)', bad: 'var(--bad-dot)', idle: 'var(--faint)', teal: 'var(--teal-fg)' }[i.tone] || 'var(--accent)')}></span></div>
                <span class="small tnum" style="font-weight:600;color:var(--fg-2)">${i.done} / ${i.total}</span></div>
            </button>`; })}</div>` : nothing}`;
        })}
      </div>
      <div class="detail">
        ${pk ? PacketDetail(p, pk, infos.get(pk.id)) : html`<div class="card"><p class="muted">No packets yet. Add a custom packet to start.</p></div>`}
        <section class="card">
          <h2 style="font-size:17px">Activity</h2>
          ${(p.activity || []).length ? html`<div class="activity">${p.activity.slice(0, 10).map((a) => html`<div class="it"><span class="dot" style=${'background:' + ({ bad: 'var(--bad-dot)', warn: 'var(--warn-dot)', ok: 'var(--ok-dot)' }[a.tone] || 'var(--accent)')}></span><div class="col" style="gap:2px;min-width:0"><span>${a.text}</span><span class="small muted">${a.at}</span></div></div>`)}</div>`
            : html`<p class="muted" style="margin:0">Uploads, reviews, requests and submissions show up here.</p>`}
        </section>
      </div>
    </div>
  </main>`;
}

function PacketDetail(p, pk, info) {
  const c = info.c;
  const parts = [];
  if (c.missing) parts.push(c.missing + ' missing');
  if (c.action) parts.push(c.action + ' awaiting EQORE review');
  if (c.changes) parts.push(c.changes + ' returned to partner for changes');
  if (c.denied) parts.push(c.denied + ' denied, needs a corrected version');
  const letter = pk.docs.find((d) => d.letter);
  const G = {
    complete: ['Phase complete', 'g-ok'],
    approved: ['Approved by ' + pk.to, 'g-ok'],
    blocked: ['Submission blocked: ' + parts.join(', '), 'g-bad'],
    waiting: ['With ' + pk.to + ' for review', 'g-blue'],
    progress: ['Collecting documents' + (parts.length ? ': ' + parts.join(', ') : ''), 'g-idle'],
    ready: ['Ready to submit to ' + pk.to, 'g-teal'],
    later: ['Not started', 'g-idle'],
    kickedoff: ['Kicked off: waiting on partners to upload', 'g-blue'],
    empty: ['Add the documents this packet needs', 'g-idle']
  }[info.gate];
  const explain = {
    blocked: 'The Vault holds the submission until every document is in and reviewed by EQORE. Open any document to upload, review or request it.',
    waiting: 'Submitted documents are with ' + pk.to + '. Record their decision here when it comes back.',
    ready: 'Every document is in and reviewed. Submitting marks them as sent to ' + pk.to + '.',
    later: 'Kick off the packet to email each partner the documents they owe.',
    kickedoff: 'Each partner was emailed the list of documents they owe. Uploads appear here as they arrive.',
    progress: 'Documents due later in the project stay “Not due yet” until they’re requested.',
    empty: 'Use “Add required document” below to list what ' + pk.to + ' needs.'
  }[info.gate] || pk.blurb || '';
  const canSubmit = info.gate === 'ready';
  const zi = zipInfo(p, pk, info);
  return html`<section class="card" style="padding:22px">
    <div class="head" style="align-items:flex-start">
      <div class="col" style="gap:4px;min-width:0"><div class="eyebrow">${pk.phase} · ${pk.kind}</div><h2 style="font-size:22px">${pk.name}</h2>
        <div class="muted">Submitted to: ${pk.to} · Responsible: ${pk.owner}</div>
        ${pk.blurb ? html`<div class="small muted">${pk.blurb}</div>` : nothing}</div>
      <div class="col" style="align-items:flex-end;gap:8px">
        <div class="row" style="justify-content:flex-end">
          <span class=${'pill lg tone-' + info.tone}>${info.status}</span>
          <button class=${'btn' + (zi.ready ? ' primary' : '')} ?disabled=${!zi.ready} @click=${() => { ui.zip = { pid: p.id, pkId: pk.id }; rerender(); }}>${I.download} ${zi.label}</button>
        </div>
        <span class="small muted" style="text-align:right">${zi.hint}</span>
      </div>
    </div>
    <div class=${'gate ' + G[1]}>
      <div class="row" style="align-items:flex-start;flex-wrap:nowrap">${info.gate === 'blocked' ? html`<span style="margin-top:2px">${I.lock}</span>` : nothing}
        <div class="col" style="gap:4px"><div style="font-size:15px;font-weight:700">${G[0]}</div><div style="font-size:13px;line-height:1.5">${explain}</div></div></div>
      <div class="row">
        ${info.gate === 'later' ? html`<button class="btn primary" @click=${() => { ui.email = { mode: 'kickoff', pid: p.id, pkId: pk.id, edits: {} }; rerender(); }}>${I.send} Kick off packet</button>` : nothing}
        ${info.gate === 'waiting' ? html`<button class="btn primary" @click=${() => { ui.decision = { pid: p.id, pkId: pk.id, outcome: 'approved', pick: {}, reason: '', letter: null }; rerender(); }}>Record decision from ${pk.to}</button>`
          : info.gate === 'approved' ? (letter ? html`<button class="btn primary" @click=${() => { ui.openDoc = { pid: p.id, pkId: pk.id, docId: letter.id }; rerender(); }}>View approval letter</button>` : nothing)
          : info.gate === 'complete' ? nothing
          : html`<button class=${'btn' + (canSubmit ? ' primary' : '')} ?disabled=${!canSubmit} @click=${() => { ui.submit = { pid: p.id, pkId: pk.id }; rerender(); }}>Submit to ${pk.to}</button>`}
        ${c.missing ? html`<button class="btn danger" @click=${() => { ui.email = { mode: 'request', pid: p.id, pkId: pk.id, edits: {} }; rerender(); }}>Request missing documents</button>` : nothing}
        ${info.gate === 'approved' ? html`<button class="btn" @click=${() => { ui.confirm = { title: 'Close this packet?', text: 'The packet is marked complete and kept for reference.', label: 'Close packet', run: () => { ui.confirm = null; mutate(p.id, (pp) => { const k = findPk(pp, pk.id); k.closed = true; logTo(pp, k.name + ' closed as complete.', 'ok'); }); } }; rerender(); }}>Close packet</button>` : nothing}
        ${info.gate === 'complete' ? html`<button class="btn" @click=${() => mutate(p.id, (pp) => { findPk(pp, pk.id).closed = false; })}>Reopen packet</button>` : nothing}
      </div>
      ${pk.lastSent ? html`<div class="sentmsg">${I.check} ${pk.lastSent}</div>` : nothing}
    </div>
    <div class="row" style="gap:6px">${ORDER.filter((k) => c[k] > 0 || k !== 'notdue').map((k) => html`<span class=${'pill t-' + k + (c[k] ? '' : ' dim')}>${DS[k]} · ${c[k]}</span>`)}</div>
    <div class="scrollbox"><div class="dtable">
      <div class="drow hd"><div>Document</div><div>Owner</div><div>Status</div><div>Latest</div></div>
      ${pk.docs.map((d) => {
        const opts = [...new Set((p.partners || []).map((x) => x.label).concat(OWNER_DEFAULTS, [d.owner]))];
        const open = () => { ui.openDoc = { pid: p.id, pkId: pk.id, docId: d.id }; ui.dismissFor = null; rerender(); };
        return html`<div class=${'drow' + (d.status === 'action' ? ' hl' : '')}>
          <button class="linkish" @click=${open}>${I.file}<span class="col" style="gap:1px;min-width:0"><span class="nm">${d.name}</span><span class="small muted">${d.ref}${d.file ? ' · ' + d.file.name : ''}</span></span></button>
          <label class="col" style="gap:2px;min-width:0"><span class="sr">Owner of ${d.name}</span>
            <select class=${'owner' + (d.reassigned ? ' re' : '')} .value=${d.owner} @change=${(e) => mutate(p.id, (pp) => { const dd = findDoc(findPk(pp, pk.id), d.id); logTo(pp, dd.name + ' reassigned from ' + dd.owner + ' to ' + e.target.value + '.', 'info'); dd.owner = e.target.value; dd.reassigned = true; })}>
              ${opts.map((o) => html`<option value=${o} ?selected=${o === d.owner}>${o}</option>`)}</select>
            ${d.reassigned ? html`<span style="font-size:11px;font-weight:600;color:var(--accent)">Reassigned</span>` : nothing}</label>
          <button class="linkish" @click=${open}><span class=${'pill t-' + d.status}>${DS[d.status]}</span></button>
          <button class="linkish" @click=${open} style="font-size:13px"><span class=${d.status === 'missing' || d.status === 'denied' ? 'note-bad' : d.status === 'action' ? 'note-warn' : 'note-ok'}>${d.note}</span></button>
        </div>`;
      })}
      <div style="padding:12px 14px;border-top:1px solid var(--line-2)">
        ${!ui.addDoc || ui.addDoc.pkId !== pk.id
          ? html`<button class="btn sm dashed" @click=${() => { ui.addDoc = { pkId: pk.id, name: '', ref: '', owner: 'Granite EPC' }; rerender(); }}>+ Add required document</button>`
          : AddDocForm(p, pk)}
      </div>
    </div></div>
  </section>`;
}

function AddDocForm(p, pk) {
  const a = ui.addDoc; const opts = [...new Set((p.partners || []).map((x) => x.label).concat(OWNER_DEFAULTS))];
  return html`<form class="formbox" @submit=${(e) => {
    e.preventDefault(); if (!a.name.trim()) return;
    mutate(p.id, (pp) => { const k = findPk(pp, pk.id); k.docs.push({ id: uid('d'), name: a.name.trim(), ref: a.ref.trim() || 'Custom requirement', owner: a.owner, status: 'missing', note: 'Added ' + stamp(), custom: true, history: [{ at: stamp(), text: 'Added as a requirement' }] }); logTo(pp, 'Added ' + a.name.trim() + ' to ' + k.name + ' (owner: ' + a.owner + ').', 'info'); });
    ui.addDoc = null;
  }}>
    <div style="font-weight:700">Add a required document to ${pk.name}</div>
    <div class="grid3">
      <label class="field">Document name<input id="nd-name" type="text" .value=${a.name} @input=${(e) => { a.name = e.target.value; rerender(); }} placeholder="e.g. Knox box key confirmation" required></label>
      <label class="field">Reference (optional)<input id="nd-ref" type="text" .value=${a.ref} @input=${(e) => { a.ref = e.target.value; }} placeholder="e.g. Fire marshal comment, ESS-18.0"></label>
      <label class="field">Who provides it<select id="nd-owner" .value=${a.owner} @change=${(e) => { a.owner = e.target.value; }}>${opts.map((o) => html`<option ?selected=${o === a.owner}>${o}</option>`)}</select></label>
    </div>
    <div class="small muted">It’s added as Missing. The packet can’t be submitted until it’s uploaded and reviewed.</div>
    <div class="row"><button class="btn primary" type="submit" ?disabled=${!a.name.trim()}>Add document</button><button class="btn" type="button" @click=${() => { ui.addDoc = null; rerender(); }}>Cancel</button></div>
  </form>`;
}

function currentDoc() {
  const o = ui.openDoc; if (!o) return null;
  const p = projects.get(o.pid); if (!p) return null; const pk = findPk(p, o.pkId); if (!pk) return null; const doc = findDoc(pk, o.docId); if (!doc) return null;
  return { p, pk, doc };
}

function Preview(p, pk, d) {
  const pickFile = (e) => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) uploadFor(p.id, pk.id, d.id, f); };
  const drop = {
    dragover: (e) => { e.preventDefault(); if (!ui.drag) { ui.drag = true; rerender(); } },
    dragleave: () => { ui.drag = false; rerender(); },
    drop: (e) => { e.preventDefault(); ui.drag = false; const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f) uploadFor(p.id, pk.id, d.id, f); else rerender(); }
  };
  const uploader = (label, sub) => html`<div class=${'empty' + (ui.drag ? ' drag' : '')} @dragover=${drop.dragover} @dragleave=${drop.dragleave} @drop=${drop.drop}>
    ${I.upload}<strong style="color:var(--fg)">${label}</strong><span>${sub}</span>
    ${ui.docAction ? html`<div class="thinking"><span class="spin"></span>${ui.docAction}</div>` : html`<label class="btn primary">Choose file<input type="file" class="sr" accept=".pdf,.png,.jpg,.jpeg,.webp,.gif,.txt,.md,.csv,.json" @change=${pickFile}></label>`}
    <span class="small">PDF, image or text file, up to 20 MB${assets ? '' : '. Files are kept for this visit only'}.</span></div>`;
  if (!d.file) {
    return html`<div class="preview">${uploader(d.status === 'notdue' ? 'Not due yet' : 'Nothing uploaded yet', 'Drop the file here to upload it for ' + d.owner + '. The AI pre-review runs as soon as it arrives.')}</div>`;
  }
  const f = d.file; const url = fileUrl(f) || localUrl(d.id);
  const flags = d.review ? d.review.flags.filter((x) => !x.dismissed) : [];
  let body;
  if (f.type === 'application/pdf') body = html`<div class="pdfpages" data-pdf=${d.id}></div>`;
  else if (isImg(f.type)) body = url ? html`<img class="doc" src=${url} alt=${d.name}>` : html`<div class="empty">The image isn’t available in this view.</div>`;
  else {
    if (!textCache.has(d.id)) { store.getText(d.id).then(rerender).catch(() => {}); body = html`<div class="paper">Loading…</div>`; }
    else {
      const lines = (textCache.get(d.id) || '').split('\n');
      body = html`<div class="paper">${lines.map((ln, i) => {
        const hit = flags.find((fl) => fl.quote && ln.includes(fl.quote));
        const cls = i === 0 ? 't' : /^\d+\.\s+[A-Z]/.test(ln) && ln.length < 60 && !/\.$/.test(ln) ? 'h' : '';
        return ln.trim() ? html`<div class=${'ln ' + cls + (hit ? ' flagged' : '')}><span>${ln}</span>${hit ? html`<span class=${'badge b ' + hit.severity}>${hit.n}</span>` : nothing}</div>` : html`<div style="height:8px"></div>`;
      })}</div>`;
    }
  }
  return html`<div class="preview">
    <div class="row" style="width:100%;max-width:640px;justify-content:space-between">
      <span class="small muted" style="min-width:0;overflow-wrap:anywhere">${f.name} · ${Math.max(1, Math.round((f.size || 0) / 1024))} KB · ${f.at}</span>
      <span class="row">
        ${url && !f.textOnly ? html`<a class="btn xs" href=${url} target="_blank" rel="noopener">Open file</a>` : nothing}
        ${ui.docAction ? html`<span class="small">${ui.docAction}</span>` : html`<label class="btn xs">Replace file<input type="file" class="sr" accept=".pdf,.png,.jpg,.jpeg,.webp,.gif,.txt,.md,.csv,.json" @change=${pickFile}></label>`}
      </span>
    </div>
    ${body}
  </div>`;
}

function Review(p, pk, d) {
  const busy = ui.ai && ui.ai.docId === d.id && !ui.ai.error;
  const err = ui.ai && ui.ai.docId === d.id && ui.ai.error;
  const r = d.review;
  const active = r ? r.flags.filter((f) => !f.dismissed) : [];
  const nHigh = active.filter((f) => f.severity === 'high').length;
  const setFlag = (n, val) => mutate(p.id, (pp) => { const dd = findDoc(findPk(pp, pk.id), d.id); const fl = dd.review.flags.find((x) => x.n === n); fl.dismissed = val; if (val) logTo(pp, 'Dismissed AI flag “' + fl.title + '” on ' + dd.name + ': ' + val.reason, 'info'); });
  return html`<div class="col" style="gap:12px">
    <div class="row" style="justify-content:space-between">
      <div class="row">${I.spark}<h3 style="font-size:18px">AI pre-review</h3></div>
      ${d.file && !busy ? html`<button class="btn xs" ?disabled=${!sample} title=${sample ? '' : 'Open this page on claude.ai to use AI review'} @click=${() => runReview(p.id, pk.id, d.id)}>${r ? 'Run again' : 'Run review'}</button>` : nothing}
    </div>
    ${!d.file ? html`<div class="small muted">Runs automatically when a file is uploaded. It checks the document against the plan set facts and the rest of this packet.</div>` : nothing}
    ${busy ? html`<div class="thinking"><span class="spin"></span><span style="flex:1">${ui.ai.phase || 'Reviewing…'}</span><button class="btn xs" @click=${() => ui.ai.ctl && ui.ai.ctl.abort()}>Stop</button></div>` : nothing}
    ${err ? html`<div class="banner">${err}</div>` : nothing}
    ${d.file && !r && !busy && !err ? html`<div class="small muted">${sample ? 'No review yet for this file.' : 'AI review runs when this page is opened on claude.ai.'}</div>` : nothing}
    ${r && !busy ? html`
      ${r.summary ? html`<div style="font-size:13px;color:var(--fg-2);line-height:1.5">${r.summary}</div>` : nothing}
      <div class="row" style="gap:6px">
        ${nHigh ? html`<span class="pill tone-bad">${nHigh} high</span>` : nothing}
        ${active.length - nHigh ? html`<span class="pill tone-mid">${active.length - nHigh} medium/low</span>` : nothing}
        ${r.flags.length - active.length ? html`<span class="pill tone-idle">${r.flags.length - active.length} dismissed</span>` : nothing}
        ${r.passed.length ? html`<span class="pill tone-ok">${plural(r.passed.length, 'check')} passed</span>` : nothing}
        ${!r.flags.length ? html`<span class="pill tone-ok">No issues found</span>` : nothing}
      </div>
      ${r.flags.map((f) => f.dismissed ? html`<div class="flag off">
          <div class="row" style="flex-wrap:nowrap"><span class="badge off">${f.n}</span><span style="font-size:13px;font-weight:600;color:var(--muted);text-decoration:line-through;flex:1">${f.title}</span>
            <button class="btn xs" @click=${() => setFlag(f.n, null)}>Undo</button></div>
          <div class="small" style="color:var(--fg-2)"><strong>Dismissed ${f.dismissed.at}:</strong> ${f.dismissed.reason}</div></div>`
        : html`<div class=${'flag ' + f.severity}>
          <div class="row" style="flex-wrap:nowrap"><span class=${'badge ' + f.severity}>${f.n}</span><span class=${'eyebrow sev-' + f.severity} style="font-size:11px">${f.severity}</span><span class="small muted" style="margin-left:auto;text-align:right">${f.ref}</span></div>
          <div style="font-weight:700">${f.title}</div><div style="font-size:13px;color:var(--fg-2);line-height:1.5">${f.detail}</div>
          ${ui.dismissFor === f.n ? html`<div class="col" style="gap:8px">
              <label class="field" style="font-size:12px">Why is this not an issue? (required)<textarea id=${'dismiss-' + f.n} rows="3" .value=${ui.dismissText} @input=${(e) => { ui.dismissText = e.target.value; rerender(); }} placeholder="e.g. Engineer of record confirmed 400 A is correct; ESS-13.0 will be revised."></textarea></label>
              <div class="row"><button class=${'btn xs' + (ui.dismissText.trim() ? ' primary' : '')} ?disabled=${!ui.dismissText.trim()} @click=${() => { const reason = ui.dismissText.trim(); ui.dismissFor = null; ui.dismissText = ''; setFlag(f.n, { reason, at: stamp(), by: myName || 'EQORE' }); }}>Dismiss with reason</button>
              <button class="btn xs" @click=${() => { ui.dismissFor = null; ui.dismissText = ''; rerender(); }}>Cancel</button></div></div>`
            : html`<button class="btn xs" style="align-self:flex-start" @click=${() => { ui.dismissFor = f.n; ui.dismissText = ''; rerender(); }}>Dismiss flag</button>`}
        </div>`)}
      ${r.passed.map((x) => html`<div class="passed">${I.check}<span>${x}</span></div>`)}
      <div class="small muted">Reviewed ${r.at}${r.model === 'demo' ? ' (demo result; run again for a live review)' : ''}.</div>` : nothing}
  </div>`;
}

function DocModal() {
  const cd = currentDoc(); if (!cd) return nothing;
  const { p, pk, doc: d } = cd;
  const close = () => { ui.openDoc = null; ui.dismissFor = null; if (ui.ai && ui.ai.error) ui.ai = null; rerender(); };
  const setStatus = (status, note, log, tone) => mutate(p.id, (pp) => { const dd = findDoc(findPk(pp, pk.id), d.id); dd.status = status; dd.note = note; dd.history = [{ at: stamp(), text: log }].concat(dd.history || []); logTo(pp, log + ' (' + dd.name + ', ' + pk.name + ')', tone); });
  const active = d.review ? d.review.flags.filter((f) => !f.dismissed) : [];
  const ownerName = d.owner;
  let actions = nothing;
  if (d.status === 'action') actions = html`
    ${active.length ? html`<button class="btn primary grow" @click=${() => { setStatus('changes', 'Returned ' + day() + ' with ' + plural(active.length, 'comment'), 'Returned to ' + ownerName + ' with ' + plural(active.length, 'comment'), 'warn'); ui.openDoc = null; ui.email = { mode: 'return', pid: p.id, pkId: pk.id, docId: d.id, edits: {} }; rerender(); }}>Return to ${ownerName} with ${plural(active.length, 'comment')}</button>` : nothing}
    <button class=${'btn grow' + (active.length ? '' : ' teal')} @click=${() => { setStatus('ready', 'Reviewed by EQORE · ' + day(), 'Marked ready for submission by EQORE' + (active.length ? ' with ' + plural(active.length, 'open flag') : ''), 'ok'); close(); }}>${active.length ? 'Mark ready anyway' : 'Mark ready for submission'}</button>`;
  else if (d.status === 'missing' || d.status === 'changes') actions = html`<button class="btn primary grow" @click=${() => { ui.openDoc = null; ui.email = { mode: 'early', pid: p.id, pkId: pk.id, docId: d.id, edits: {} }; rerender(); }}>${d.status === 'changes' ? 'Remind ' + ownerName : 'Request from ' + ownerName}</button>`;
  else if (d.status === 'notdue') actions = html`<button class="btn grow" @click=${() => { ui.openDoc = null; ui.email = { mode: 'early', pid: p.id, pkId: pk.id, docId: d.id, edits: {} }; rerender(); }}>Request now from ${ownerName}</button>`;
  else if (d.status === 'ready') actions = html`<button class="btn grow" @click=${() => setStatus('action', 'Moved back to review · ' + day(), 'Moved back to EQORE review', 'info')}>Move back to review</button>`;
  else if (d.status === 'submitted') actions = html`<div class="small muted" style="width:100%">Record ${pk.to}’s decision for the whole packet from “Record decision”, or for this document:</div>
    <button class="btn teal grow" @click=${() => setStatus('approved', 'Approved ' + day(), 'Approved by ' + pk.to, 'ok')}>Approved</button>
    <button class="btn danger grow" @click=${() => { ui.decision = { pid: p.id, pkId: pk.id, outcome: 'returned', pick: { [d.id]: true }, reason: '', letter: null }; ui.openDoc = null; rerender(); }}>Denied / returned</button>`;
  else if (d.status === 'denied') actions = html`<button class="btn primary grow" @click=${() => { ui.openDoc = null; ui.email = { mode: 'denial', pid: p.id, pkId: pk.id, docId: d.id, edits: {} }; rerender(); }}>Send denial to ${ownerName}</button>`;
  return html`<div class="scrim" @click=${(e) => { if (e.target === e.currentTarget) close(); }}>
    <div class="dialog wide" role="dialog" aria-modal="true" aria-label=${'Document: ' + d.name}>
      <div class="dhead">
        <div class="col" style="gap:2px;min-width:0"><div class="eyebrow">${pk.name}</div><h2 style="font-size:20px">${d.name}</h2><div class="small muted">${d.ref} · Owner: ${d.owner} · ${d.note}</div></div>
        <div class="row"><span class=${'pill lg t-' + d.status}>${DS[d.status]}</span><button class="iconbtn" aria-label="Close document" @click=${close}>${I.close}</button></div>
      </div>
      <div class="viewer">
        ${Preview(p, pk, d)}
        <div class="panel">
          ${Review(p, pk, d)}
          <div class="small muted" style="line-height:1.5;border-top:1px solid var(--line-2);padding-top:10px">The AI flags likely issues to speed up review. An EQORE reviewer makes the final call before anything goes to ${pk.to}.</div>
          ${actions !== nothing ? html`<div class="row" style="margin-top:auto">${actions}</div>` : nothing}
          ${(d.history || []).length ? html`<details><summary>${I.caret} History</summary><div class="hist">${d.history.slice(0, 12).map((h) => html`<div><strong>${h.at}</strong> · ${h.text}</div>`)}</div></details>` : nothing}
          ${d.custom ? html`<button class="btn xs danger" style="align-self:flex-start" @click=${() => { ui.confirm = { title: 'Remove ' + d.name + '?', text: 'It’s taken off the ' + pk.name + ' packet. Its upload history is removed with it.', label: 'Remove document', run: () => { ui.confirm = null; ui.openDoc = null; mutate(p.id, (pp) => { const k = findPk(pp, pk.id); k.docs = k.docs.filter((x) => x.id !== d.id); logTo(pp, 'Removed ' + d.name + ' from ' + k.name + '.', 'info'); }); } }; rerender(); }}>Remove document</button>` : nothing}
        </div>
      </div>
    </div></div>`;
}

function EmailModal() {
  if (!ui.email) return nothing;
  const drafts = buildDrafts();
  const e = ui.email; const p = projects.get(e.pid); const pk = p && findPk(p, e.pkId);
  if (!pk) return nothing;
  const title = { kickoff: 'Kick off ' + pk.name, request: 'Request missing documents', early: 'Request document', denial: 'Send denial', return: 'Send review comments' }[e.mode];
  const sub = { kickoff: 'One email to each partner who owes a document in this packet. Edit before sending.', request: 'Drafted from the missing items in ' + pk.name + '. Edit before sending.', early: 'Edit before sending.', denial: 'Forwards the reviewer’s denial to the partner who prepared the document.', return: 'The document is now marked “Changes requested”. This email carries the open AI flags as comments.' }[e.mode];
  return html`<div class="scrim" @click=${(ev) => { if (ev.target === ev.currentTarget) { ui.email = null; rerender(); } }}>
    <div class="dialog" role="dialog" aria-modal="true" aria-label=${title}>
      <div class="dhead"><div class="col" style="gap:2px"><h2 style="font-size:19px">${title}</h2><div class="small muted">${sub}</div></div>
        <button class="iconbtn" aria-label="Close" @click=${() => { ui.email = null; rerender(); }}>${I.close}</button></div>
      <div class="dbody">
        ${drafts.length ? drafts.map((dr) => html`<div class="email">
          <div class="meta"><span class="muted" style="font-weight:600">To</span><span style="font-weight:600">${dr.to}</span>
            <span class="muted" style="font-weight:600">Cc</span><span>${dr.cc}</span>
            <span class="muted" style="font-weight:600">Subject</span><span style="font-weight:600">${dr.subject}</span>
            ${dr.attach ? html`<span class="muted" style="font-weight:600">Attach</span><span style="color:var(--accent);font-weight:600">${dr.attach}</span>` : nothing}</div>
          <label class="field">Message<textarea id=${'em-' + dr.key.replace(/[^a-z0-9]/gi, '')} rows="12" .value=${dr.body} @input=${(ev) => { e.edits = e.edits || {}; e.edits[dr.key] = ev.target.value; }}></textarea></label>
          <div class="row">
            <button class="btn xs" @click=${() => copyText('To: ' + dr.to + '\nSubject: ' + dr.subject + '\n\n' + ((e.edits || {})[dr.key] ?? dr.body))}>Copy email</button>
            ${dr.email ? html`<a class="btn xs" href=${'mailto:' + encodeURIComponent(dr.email) + '?subject=' + encodeURIComponent(dr.subject) + '&body=' + encodeURIComponent(((e.edits || {})[dr.key] ?? dr.body))}>Open in email app</a>` : nothing}
          </div>
        </div>`) : html`<p class="muted">There’s nothing to send for this packet right now.</p>`}
        <div class="small muted">This demo doesn’t send email. Copy the text into your email, then mark it as sent to update the packet.</div>
      </div>
      <div class="dfoot"><button class="btn" @click=${() => { ui.email = null; rerender(); }}>Cancel</button>
        <button class="btn primary" ?disabled=${!drafts.length} @click=${markSent}>${I.send} Mark ${drafts.length > 1 ? plural(drafts.length, 'email') : 'email'} as sent</button></div>
    </div></div>`;
}

function SubmitModal() {
  const s = ui.submit; if (!s) return nothing;
  const p = projects.get(s.pid); const pk = p && findPk(p, s.pkId); if (!pk) return nothing;
  const docs = pk.docs.filter((d) => d.status === 'ready');
  const go = () => { ui.submit = null; mutate(p.id, (pp) => { const k = findPk(pp, pk.id); k.docs.forEach((d) => { if (d.status === 'ready') { d.status = 'submitted'; d.note = 'Submitted ' + day(); d.history = [{ at: stamp(), text: 'Submitted to ' + k.to }].concat(d.history || []); } }); k.submittedAt = stamp(); k.lastSent = 'Submitted to ' + k.to + ' · ' + stamp(); logTo(pp, 'Submitted ' + k.name + ' to ' + k.to + ' (' + plural(docs.length, 'document') + ').', 'ok'); }); toast('Submitted to ' + pk.to + '.'); };
  return html`<div class="scrim"><div class="dialog narrow" role="dialog" aria-modal="true" aria-label="Submit packet">
    <div class="dhead"><h2 style="font-size:19px">Submit ${pk.name} to ${pk.to}?</h2></div>
    <div class="dbody"><div class="muted">These ${plural(docs.length, 'document')} will be marked as submitted. Already approved documents stay as they are.</div>
      <div class="checks">${docs.map((d) => html`<div class="row" style="flex-wrap:nowrap">${I.file}<span>${d.name}</span></div>`)}</div></div>
    <div class="dfoot"><button class="btn" @click=${() => { ui.submit = null; rerender(); }}>Cancel</button><button class="btn primary" @click=${go}>Submit packet</button></div>
  </div></div>`;
}

function DecisionModal() {
  const s = ui.decision; if (!s) return nothing;
  const p = projects.get(s.pid); const pk = p && findPk(p, s.pkId); if (!pk) return nothing;
  const subs = pk.docs.filter((d) => d.status === 'submitted');
  const picked = subs.filter((d) => s.pick[d.id]);
  const ok = s.outcome === 'approved' || (picked.length && s.reason.trim());
  const go = async () => {
    let letter = null;
    if (s.outcome === 'approved' && s.letter) {
      const f = s.letter; let type = TYPES[extOf(f.name)] || f.type; let assetId = '';
      if (assets && type) { try { assetId = (await assets.upload(f, { type })).id; } catch (e) { toast('The letter didn’t upload. The decision is still recorded.'); } }
      letter = { id: uid('d'), name: 'Approval letter', ref: 'Issued by ' + pk.to, owner: pk.to, status: 'approved', note: 'Received ' + day(), letter: true, history: [{ at: stamp(), text: 'Approval letter filed' }], file: type ? { assetId, name: f.name, type, size: f.size, at: stamp(), localOnly: !assetId } : null };
      if (letter.file) fileCache.set(letter.id, f);
    }
    ui.decision = null;
    mutate(p.id, (pp) => {
      const k = findPk(pp, pk.id);
      if (s.outcome === 'approved') {
        k.docs.forEach((d) => { if (d.status === 'submitted') { d.status = 'approved'; d.note = 'Approved ' + day(); d.history = [{ at: stamp(), text: 'Approved by ' + k.to }].concat(d.history || []); } });
        if (letter) k.docs.push(letter);
        logTo(pp, k.to + ' approved ' + k.name + '.', 'ok');
      } else {
        k.docs.forEach((d) => { if (s.pick[d.id] && d.status === 'submitted') { d.status = 'denied'; d.note = 'Returned ' + day() + ': ' + s.reason.trim(); d.history = [{ at: stamp(), text: 'Denied by ' + k.to + ': ' + s.reason.trim() }].concat(d.history || []); } });
        logTo(pp, k.to + ' returned ' + picked.map((d) => d.name).join(', ') + ': ' + s.reason.trim(), 'bad');
      }
    });
  };
  return html`<div class="scrim"><div class="dialog narrow" role="dialog" aria-modal="true" aria-label="Record decision">
    <div class="dhead"><h2 style="font-size:19px">Decision from ${pk.to}</h2><button class="iconbtn" aria-label="Close" @click=${() => { ui.decision = null; rerender(); }}>${I.close}</button></div>
    <div class="dbody">
      <div class="row">
        <button class=${'tpl' + (s.outcome === 'approved' ? ' on' : '')} @click=${() => { s.outcome = 'approved'; rerender(); }}>Approved</button>
        <button class=${'tpl' + (s.outcome === 'returned' ? ' on' : '')} @click=${() => { s.outcome = 'returned'; rerender(); }}>Denied or returned</button>
      </div>
      ${s.outcome === 'approved' ? html`<div class="muted">All ${plural(subs.length, 'submitted document')} will be marked approved.</div>
        <label class="field">Approval letter (optional)<input type="file" accept=".pdf,.png,.jpg,.jpeg,.txt" @change=${(e) => { s.letter = e.target.files[0] || null; }}></label>`
      : html`<div class="field">Which documents were returned?<div class="checks">${subs.map((d) => html`<label><input type="checkbox" .checked=${!!s.pick[d.id]} @change=${(e) => { s.pick[d.id] = e.target.checked; rerender(); }}><span>${d.name}</span></label>`)}</div></div>
        <label class="field">Reason given by ${pk.to}<input id="deny-reason" type="text" .value=${s.reason} @input=${(e) => { s.reason = e.target.value; rerender(); }} placeholder="e.g. structural calcs not stamped"></label>`}
    </div>
    <div class="dfoot"><button class="btn" @click=${() => { ui.decision = null; rerender(); }}>Cancel</button><button class="btn primary" ?disabled=${!ok} @click=${go}>Record decision</button></div>
  </div></div>`;
}

function NewPacketModal() {
  const n = ui.newPacket; if (!n) return nothing;
  const p = projects.get(n.pid); if (!p) return nothing;
  const tplNames = Object.keys(PACKET_TEMPLATES).concat(['Copy a packet']);
  const preview = n.tpl === 'Copy a packet' ? ((findPk(p, n.copyFrom) || { docs: [] }).docs.map((d) => [d.name, d.ref, d.owner])) : PACKET_TEMPLATES[n.tpl];
  const ok = n.name.trim() && n.to.trim();
  const go = (e) => {
    e.preventDefault(); if (!ok) return;
    const id = uid('p');
    mutate(p.id, (pp) => { pp.packets.push({ id, name: n.name.trim(), phase: n.phase, kind: 'Custom packet', to: n.to.trim(), owner: 'EQORE', custom: true, blurb: '', docs: preview.map((d) => ({ id: uid('d'), name: d[0], ref: d[1], owner: d[2], status: 'notdue', note: '—', custom: true, history: [] })) }); logTo(pp, 'Created custom packet ' + n.name.trim() + ' for ' + n.to.trim() + '.', 'info'); });
    ui.sel[p.id] = id; if (ui.collapsed[p.id]) ui.collapsed[p.id][n.phase] = false; ui.newPacket = null;
  };
  return html`<div class="scrim"><form class="dialog narrow" role="dialog" aria-modal="true" aria-label="New custom packet" @submit=${go}>
    <div class="dhead"><h2 style="font-size:19px">New custom packet</h2><button type="button" class="iconbtn" aria-label="Close" @click=${() => { ui.newPacket = null; rerender(); }}>${I.close}</button></div>
    <div class="dbody">
      <label class="field">Packet name<input id="np-name" type="text" .value=${n.name} @input=${(e) => { n.name = e.target.value; rerender(); }} placeholder="e.g. Incentive program application" required></label>
      <label class="field">Submitted to<input id="np-to" type="text" .value=${n.to} @input=${(e) => { n.to = e.target.value; rerender(); }} placeholder="e.g. Utility program administrator" required></label>
      <label class="field">Phase<select id="np-phase" .value=${n.phase} @change=${(e) => { n.phase = e.target.value; }}>${PHASES.map((ph) => html`<option ?selected=${ph === n.phase}>${ph}</option>`)}</select></label>
      <div class="field">Start from<div class="row" style="gap:6px">${tplNames.map((t) => html`<button type="button" class=${'tpl' + (n.tpl === t ? ' on' : '')} @click=${() => { n.tpl = t; if (t === 'Copy a packet' && !n.copyFrom) n.copyFrom = p.packets[0] && p.packets[0].id; rerender(); }}>${t}</button>`)}</div></div>
      ${n.tpl === 'Copy a packet' ? html`<label class="field">Copy documents from<select .value=${n.copyFrom} @change=${(e) => { n.copyFrom = e.target.value; rerender(); }}>${p.packets.map((x) => html`<option value=${x.id} ?selected=${x.id === n.copyFrom}>${x.name}</option>`)}</select></label>` : nothing}
      <div class="small muted">${preview.length ? 'Starts with ' + plural(preview.length, 'document') + ': ' + preview.map((d) => d[0]).join(', ') + '.' : 'Starts empty. Add documents after creating it.'}</div>
    </div>
    <div class="dfoot"><button type="button" class="btn" @click=${() => { ui.newPacket = null; rerender(); }}>Cancel</button><button class="btn primary" type="submit" ?disabled=${!ok}>Create packet</button></div>
  </form></div>`;
}

function NewProjectModal() {
  const n = ui.newProject; if (!n) return nothing;
  const ok = n.name.trim();
  const go = (e) => {
    e.preventDefault(); if (!ok) return;
    const id = 'pj' + Math.random().toString(36).slice(2, 8);
    const epc = n.epc.trim() || 'TBD';
    const p = { id, name: n.name.trim(), address: n.address.trim(), size: n.size.trim(), epc, stage: 'Pre-planning', facts: '', createdAt: Date.now(), order: 50,
      partners: [
        { label: 'EQORE', name: 'EQORE', role: 'Owner', contact: 'EQORE Engineering', email: 'engineering@eqore.example' },
        { label: 'Granite EPC', name: epc, role: 'EPC', contact: n.contact.trim() || 'Project lead', email: n.email.trim() },
        { label: 'Engineer of record', name: 'Engineer of record', role: 'Engineer of record', contact: 'Engineer of record', email: '' },
        { label: 'Customer', name: n.name.trim(), role: 'Facility', contact: 'Facilities team', email: '' },
        { label: 'Utility', name: 'Utility', role: 'View only', contact: 'Interconnection desk', email: '' }],
      packets: STANDARD_PACKETS.map((def) => ({ id: uid('p'), name: def[0], phase: def[1], kind: def[2], to: def[3], owner: def[4], blurb: def[5], docs: def[6].map((d) => ({ id: uid('d'), name: d[0], ref: d[1], owner: d[2], status: 'notdue', note: '—', history: [] })) })),
      activity: [{ at: stamp(), text: 'Project created with the standard packet set.', tone: 'info' }] };
    // The EPC slot keeps the "Granite EPC" owner label used by the packet templates; show the real company name in the partner list.
    projects.set(id, p); ui.newProject = null;
    store.save(p).catch(() => toast('Couldn’t save the new project. Try again.'));
    location.hash = 'p-' + id;
  };
  const f = (k, label, ph, req) => html`<label class="field">${label}<input id=${'npj-' + k} type="text" .value=${n[k]} @input=${(e) => { n[k] = e.target.value; rerender(); }} placeholder=${ph} ?required=${req}></label>`;
  return html`<div class="scrim"><form class="dialog narrow" role="dialog" aria-modal="true" aria-label="New project" @submit=${go}>
    <div class="dhead"><h2 style="font-size:19px">New project</h2><button type="button" class="iconbtn" aria-label="Close" @click=${() => { ui.newProject = null; rerender(); }}>${I.close}</button></div>
    <div class="dbody">
      ${f('name', 'Project name', 'e.g. Somerville Ice Arena', true)}
      ${f('address', 'Site address', 'Street, town, state')}
      ${f('size', 'System size', 'e.g. 250 kW / 500 kWh')}
      <div class="grid3">${f('epc', 'EPC company', 'e.g. Granite EPC')}${f('contact', 'EPC contact', 'Name')}${f('email', 'EPC email', 'name@company.com')}</div>
      <div class="small muted">The project starts with the standard set of ${STANDARD_PACKETS.length} packets, from site assessment to operations. Kick off each packet when it’s time.</div>
    </div>
    <div class="dfoot"><button type="button" class="btn" @click=${() => { ui.newProject = null; rerender(); }}>Cancel</button><button class="btn primary" type="submit" ?disabled=${!ok}>Create project</button></div>
  </form></div>`;
}

function InviteModal() {
  const n = ui.invite; if (!n) return nothing;
  const ok = n.name.trim() && n.role.trim();
  const go = (e) => {
    e.preventDefault(); if (!ok) return;
    mutate(n.pid, (pp) => { pp.partners = (pp.partners || []).concat([{ label: n.name.trim(), name: n.name.trim(), role: n.role.trim(), contact: n.contact.trim() || n.name.trim(), email: n.email.trim() }]); logTo(pp, 'Added ' + n.name.trim() + ' (' + n.role.trim() + ') as a partner.', 'info'); });
    ui.invite = null; toast(n.name.trim() + ' can now be assigned documents.');
  };
  const f = (k, label, ph, req) => html`<label class="field">${label}<input id=${'inv-' + k} type="text" .value=${n[k]} @input=${(e) => { n[k] = e.target.value; rerender(); }} placeholder=${ph} ?required=${req}></label>`;
  return html`<div class="scrim"><form class="dialog narrow" role="dialog" aria-modal="true" aria-label="Invite partner" @submit=${go}>
    <div class="dhead"><h2 style="font-size:19px">Invite partner</h2><button type="button" class="iconbtn" aria-label="Close" @click=${() => { ui.invite = null; rerender(); }}>${I.close}</button></div>
    <div class="dbody">${f('name', 'Company', 'e.g. Northeast Fire Protection', true)}${f('role', 'Role', 'e.g. Fire protection engineer', true)}${f('contact', 'Contact name', 'Name')}${f('email', 'Email', 'name@company.com')}
      <div class="small muted">They appear in the owner list on every document in this project. This demo doesn’t send an invitation email.</div></div>
    <div class="dfoot"><button type="button" class="btn" @click=${() => { ui.invite = null; rerender(); }}>Cancel</button><button class="btn primary" type="submit" ?disabled=${!ok}>Add partner</button></div>
  </form></div>`;
}

function ConfirmModal() {
  const c = ui.confirm; if (!c) return nothing;
  return html`<div class="scrim"><div class="dialog narrow" role="alertdialog" aria-modal="true" aria-label=${c.title}>
    <div class="dhead"><h2 style="font-size:19px">${c.title}</h2></div>
    <div class="dbody"><div class="muted">${c.text}</div></div>
    <div class="dfoot"><button class="btn" @click=${() => { ui.confirm = null; rerender(); }}>Cancel</button><button class="btn danger" @click=${c.run}>${c.label}</button></div>
  </div></div>`;
}

function Modals() { return html`${DocModal()}${ZipModal()}${EmailModal()}${SubmitModal()}${DecisionModal()}${NewPacketModal()}${NewProjectModal()}${InviteModal()}${ConfirmModal()}`; }

document.getElementById('app').textContent = '';
readRoute();
boot();
</script>
